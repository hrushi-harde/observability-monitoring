name: Build, test, and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag todo-app:${{ github.sha }} .

      - name: Smoke-test container
        run: |
          set -euo pipefail
          docker run --detach --name todo-app-test --publish 8080:8080 todo-app:${{ github.sha }}
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs todo-app-test || true
            fi
            docker rm --force todo-app-test >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..10}; do
            if curl --noproxy '*' --silent --show-error --fail http://127.0.0.1:8080/ --output /tmp/todo-app-index.html; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Container did not serve the home page after 10 attempts" >&2
            exit 1
          fi
          grep -q "TO DO Application" /tmp/todo-app-index.html
          curl --noproxy '*' --fail --show-error http://127.0.0.1:8080/style.css --output /dev/null
          curl --noproxy '*' --fail --show-error http://127.0.0.1:8080/script.js --output /dev/null

      - name: Validate AWS configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          test -n "$AWS_ROLE_TO_ASSUME" || { echo "Missing GitHub Actions secret: AWS_ROLE_TO_ASSUME" >&2; exit 1; }
          test -n "$AWS_REGION" || { echo "Missing AWS_REGION; add it as a GitHub Actions variable or secret" >&2; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing GitHub Actions variable: ECR_REPOSITORY" >&2; exit 1; }

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag todo-app:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker tag todo-app:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:latest
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${REPOSITORY}:latest