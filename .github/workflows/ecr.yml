name: Build, test, and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag todo-app:${{ github.sha }} .

      - name: Smoke-test container
        run: |
          docker run --detach --name todo-app-test --publish 8080:8080 todo-app:${{ github.sha }}
          trap 'docker rm --force todo-app-test >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/ | grep -q "TO DO Application"
          curl --fail http://localhost:8080/style.css >/dev/null
          curl --fail http://localhost:8080/script.js >/dev/null

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag todo-app:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker tag todo-app:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:latest
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${REPOSITORY}:latest